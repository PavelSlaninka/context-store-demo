<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Context Store: demo</title>
  <meta name="description" content="A demo of a context store that the user holds: assistants read it, may only propose changes, and the user approves each one.">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect x="3" y="3" width="26" height="26" rx="7" fill="currentColor"/>
          <rect x="9" y="10" width="14" height="2.6" rx="1.3" fill="#fff"/>
          <rect x="9" y="15" width="10" height="2.6" rx="1.3" fill="#fff" opacity="0.8"/>
          <rect x="9" y="20" width="12" height="2.6" rx="1.3" fill="#fff" opacity="0.6"/>
        </svg>
        <span>Context Store</span>
        <span class="tag">Demo</span>
      </div>
      <nav class="steps" id="steps" aria-label="Demo screens"></nav>
      <div class="who">
        <span class="avatar" aria-hidden="true">S</span>
        <span>Sofie <small>· fictional</small></span>
      </div>
    </header>

    <main class="stage" id="stage" tabindex="-1"></main>

    <footer class="presenter">
      <div class="note">
        <span>Sample data: Sofie and Assistants A to D are made up. The chat answers are scripted. This demo sends nothing anywhere.</span>
        <button class="link-btn" type="button" id="reset">Reset demo</button>
      </div>
      <div class="pager">
        <button class="btn btn-sm btn-quiet" type="button" id="prev" aria-label="Previous screen">
          <svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Back
        </button>
        <span class="pos" id="pos">1 / 6</span>
        <button class="btn btn-sm" type="button" id="next">
          <span id="next-label">Next</span>
          <svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 4.5 13 10l-5.5 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </footer>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog" aria-labelledby="dlg-title"></dialog>

  <script src="js/data.js"></script>
  <script src="js/firewall.js"></script>
  <script src="js/story.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
